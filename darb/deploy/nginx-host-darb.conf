# Darb on a shared host: darb.mithaqstay.com → Darb's own nginx on 127.0.0.1:18800 (limits + routing live there).
# Install: /etc/nginx/sites-available/darb + symlink in sites-enabled, nginx -t && systemctl reload nginx.
# Cert: certbot certonly --nginx -d darb.mithaqstay.com (renewed by the existing certbot.timer), then the 443 block.
server {
    listen 80;
    server_name darb.mithaqstay.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://darb.mithaqstay.com$request_uri; }
}
# --- https (added once the certificate exists) ---
server {
    listen 443 ssl;
    server_name darb.mithaqstay.com;
    ssl_certificate     /etc/letsencrypt/live/darb.mithaqstay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/darb.mithaqstay.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log /var/log/nginx/darb.access.log;
    client_max_body_size 16m;
    location / {
        proxy_pass http://127.0.0.1:18800;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Darb's nginx reads the client IP from this header (as behind Cloudflare); trusted from the Docker network
        # only (/opt/darb/edge/trust-host.conf), so the per-IP limits apply to the real client.
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }
}
