# Shared by the port-80 server and the TLS server (tls/server.conf).
location = /api/health { proxy_pass http://api; }

location ~ ^/api/(ai|upload|college)/ {
    limit_req zone=slow burst=10 nodelay;
    proxy_pass http://slow;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 115s;
    proxy_request_buffering off;      # upload chunks stream straight through
}

location ~ ^/api/(auth|account)/ {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
}

location /api/ {
    limit_req zone=api burst=60 nodelay;
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 30s;
}

# The admin page (and its static files). In production, Cloudflare Access protects this path (docs/DARB-OPS.md).
location ~ ^/(darb-admin|static)/ {
    limit_req zone=auth burst=20 nodelay;
    proxy_pass http://api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
}

location /consent/ {               # the guardian's consent page (Django)
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
}

# Legal and support pages (darb/legal, built to static HTML) are served from here.
location / {
    root /usr/share/nginx/html;
    try_files $uri $uri.html $uri/ =404;
}
