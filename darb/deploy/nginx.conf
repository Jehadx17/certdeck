# Darb edge (behind Cloudflare). Routes slow paths (AI, uploads) to their own pool so they never hold sync workers.
# TLS: put Cloudflare's origin certificate and a server block in ${TLS_DIR}/server.conf (docs/DARB-OPS.md); that file
# is included below when present. Port 80 serves plain HTTP for local runs and CI only (firewalled in production).
worker_processes auto;
events { worker_connections 4096; }

http {
    server_tokens off;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    client_max_body_size 16m;           # upload chunks are <= 8 MB; sync bodies are small
    keepalive_timeout 30s;

    # The client's real IP from Cloudflare (published ranges, checked 2026-10-15: https://www.cloudflare.com/ips/).
    set_real_ip_from 173.245.48.0/20; set_real_ip_from 103.21.244.0/22; set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22; set_real_ip_from 141.101.64.0/18; set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20; set_real_ip_from 188.114.96.0/20; set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17; set_real_ip_from 162.158.0.0/15; set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14; set_real_ip_from 172.64.0.0/13; set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32; set_real_ip_from 2606:4700::/32; set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32; set_real_ip_from 2405:8100::/32; set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Per-IP limits (per-account and per-device limits are in Django). Many students share a school's NAT, so these
    # are generous and only stop floods.
    limit_req_zone $binary_remote_addr zone=api:20m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=slow:20m rate=3r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/s;
    limit_req_status 429;

    upstream api  { server api:8000;  keepalive 32; }
    upstream slow { server slow:8000; keepalive 16; }

    server {
        listen 80 default_server;
        include /etc/nginx/darb-locations.conf;
    }
    include /etc/nginx/tls/*.conf;
}
