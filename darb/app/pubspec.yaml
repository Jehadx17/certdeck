name: darb
description: "Darb (درب): study app for Saudi students."
publish_to: 'none'

# Store builds: --build-name / --build-number override these (docs/DARB-RELEASE.md).
version: 0.1.0+1

environment:
  # Flutter 3.35.7 / Dart 3.9.2: the oldest stable that meets Play's API 36 and Apple's Xcode 26 rules (docs/DARB-DEVICES.md).
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.7'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.0
  path_provider: ^2.1.5
  http: ^1.6.0
  flutter_secure_storage: ^10.0.0
  fsrs: ^2.0.1
  uuid: ^4.5.1
  flutter_markdown: ^0.7.7+1
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  markdown: ^7.3.0
  flutter_math_fork: ^0.7.4
  image_picker: ^1.2.0
  file_picker: ^11.0.0
  url_launcher: ^6.3.2
  crypto: ^3.0.7
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  purchases_flutter: ^10.16.0
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  assets:
    # The only roots the app trusts for its own servers (certificate pinning, docs/DARB-SECURITY.md)
    - assets/roots.pem
