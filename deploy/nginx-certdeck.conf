# CertDeck: certdeck.mithaqstay.com. Added next to the wa-category config; self-contained (own
# resolver, no shared zones), so it can be removed by deleting this file + reload.
server {
    listen 80;
    listen [::]:80;
    server_name certdeck.mithaqstay.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://certdeck.mithaqstay.com$request_uri; }
}
# --- https (added once the certificate exists) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name certdeck.mithaqstay.com;
    ssl_certificate     /etc/nginx/origin-cert/certdeck.mithaqstay.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/origin-cert/certdeck.mithaqstay.com/privkey.pem;
    client_max_body_size 64m;
    # Resolve at request time, so nginx still starts if the CertDeck container is down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /api/ {
        set $certdeck_api certdeck-api:8000;
        proxy_pass http://$certdeck_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    location / { return 404; }
}
