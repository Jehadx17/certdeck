# CertDeck: certdeck.mithaqstay.com → the certdeck compose project on 127.0.0.1:18765.
# Install: /etc/nginx/sites-available/certdeck + symlink in sites-enabled, then nginx -t && systemctl reload nginx.
# Cert: certbot certonly --nginx -d certdeck.mithaqstay.com (renewed by the existing certbot.timer).
server {
    listen 80;
    server_name certdeck.mithaqstay.com;
    location / { return 301 https://certdeck.mithaqstay.com$request_uri; }
}
# --- https (added once the certificate exists) ---
server {
    listen 443 ssl;
    server_name certdeck.mithaqstay.com;
    ssl_certificate     /etc/letsencrypt/live/certdeck.mithaqstay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/certdeck.mithaqstay.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log /var/log/nginx/certdeck.access.log;
    client_max_body_size 64m;              # PDF/screenshot uploads for AI generation, imports
    location /api/ {
        proxy_pass http://127.0.0.1:18765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 600s;            # AI generation can take minutes
        proxy_send_timeout 600s;
    }
    location /dl/ {                         # APK downloads: /opt/certdeck/dl, unguessable file names, no listing
        alias /opt/certdeck/dl/;
        types { application/vnd.android.package-archive apk; }
        max_ranges 0;                       # one plain download: Chrome's parallel range requests stalled on phones
    }
    location / { return 404; }
}
