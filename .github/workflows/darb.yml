# Darb CI: backend tests on Postgres, Flutter analyze/test/build, the Docker stack end to end, and (on demand or when
# iOS files change) an iOS simulator build that launches the app. CertDeck (app/, backend/) is not touched.
name: darb
on:
  push:
    branches: [darb]
    paths: ["darb/**", ".github/workflows/darb.yml"]
  pull_request:
    paths: ["darb/**", ".github/workflows/darb.yml"]
  workflow_dispatch:
    inputs:
      ios:
        description: "Also build and launch on the iOS simulator (macOS minutes cost 10x)"
        type: boolean
        default: true

concurrency: {group: "darb-${{ github.ref }}", cancel-in-progress: true}

# A piped command (… | tee report) fails the step when the command fails.
defaults: {run: {shell: "bash -eo pipefail {0}"}}

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    defaults: {run: {working-directory: darb/backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: darb/backend/requirements.txt}
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install -r requirements.txt
      - run: python manage.py test core -v 2
        env: {DATABASE_URL: "postgres://postgres:postgres@127.0.0.1:5432/darb", DARB_TESTING: "1"}

  app:
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: darb/app}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: "3.35.7", channel: stable, cache: true}
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --debug

  stack:
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: darb/deploy}}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          cp .env.example .env
          sed -i "s/^DJANGO_SECRET_KEY=.*/DJANGO_SECRET_KEY=ci-$(openssl rand -hex 24)/; s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-$(openssl rand -hex 12)/" .env
          echo "HTTP_PORT=8080" >> .env && echo "HTTPS_PORT=8443" >> .env
      - run: docker compose --env-file .env up -d --build --scale api=2
      - name: Health through nginx
        run: for i in $(seq 1 60); do curl -fsS localhost:8080/api/health && break; sleep 2; done
      - name: Sync round trip through nginx and PgBouncer
        run: |
          TOKEN=$(docker compose --env-file .env exec -T api python manage.py users create ci@example.com | sed 's/Token: //')
          NOW=$(($(date +%s)*1000))
          curl -fsS -X POST localhost:8080/api/sync -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d "{\"cursor\":0,\"docs\":[{\"id\":\"settings\",\"kind\":\"settings\",\"data\":{\"lang\":\"ar\"},\"updated_at\":$NOW}],\"reviews\":[{\"ts\":$NOW,\"card_id\":\"q:1\",\"rating\":3}]}" \
            | tee /dev/stderr | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["docs"][0]["data"]=={"lang":"ar"} and len(r["reviews"])==1'
          docker compose --env-file .env exec -T worker python manage.py worker --once
      - if: failure()
        run: docker compose --env-file .env logs --tail 200

  # Backup + restore drill (docs/DARB-RESTORE.md): encrypted pgBackRest backup + WAL archive, volume destroyed, restore,
  # every row compared. Runs when deploy/ changes or on demand; the R2 version runs on the server.
  restore:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[restore]')
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: darb/deploy}}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          cp .env.example .env
          sed -i "s/^DJANGO_SECRET_KEY=.*/DJANGO_SECRET_KEY=ci-$(openssl rand -hex 24)/; s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-$(openssl rand -hex 12)/" .env
          sed -i "s/^ARCHIVE_MODE=.*/ARCHIVE_MODE=on/; s/^PGBACKREST_REPO1_TYPE=.*/PGBACKREST_REPO1_TYPE=posix/; s#^PGBACKREST_REPO1_PATH=.*#PGBACKREST_REPO1_PATH=/var/lib/pgbackrest#" .env
          sed -i "/^PGBACKREST_REPO1_S3/d; s/^PGBACKREST_REPO1_CIPHER_PASS=.*/PGBACKREST_REPO1_CIPHER_PASS=ci-$(openssl rand -hex 24)/" .env
          echo "HTTP_PORT=8080" >> .env
      - run: REVIEWS=500000 bash tests/restore-test.sh 2>&1 | tee restore-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: restore-report, path: darb/deploy/restore-report.txt}

  # Load test at the 100k-student peak (docs/DARB-LOADTEST.md); repeated on the VPS once it exists.
  loadtest:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[loadtest]')
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: darb/deploy}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install locust==2.32.4
      - name: Configure
        run: |
          cp .env.example .env
          sed -i "s/^DJANGO_SECRET_KEY=.*/DJANGO_SECRET_KEY=ci-$(openssl rand -hex 24)/; s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-$(openssl rand -hex 12)/" .env
          printf 'HTTP_PORT=8080\nDARB_AI_STUB_MS=3000\nPG_SHARED_BUFFERS=1GB\nPG_EFFECTIVE_CACHE=4GB\n' >> .env
          nproc; free -g
      - run: bash tests/loadtest.sh 2>&1 | tee loadtest-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: loadtest-report, path: "darb/deploy/loadtest-report.txt\ndarb/deploy/tests/out/"}

  ios:
    # Manual runs, or a pushed commit whose message contains [ios] (dispatch needs the workflow on the default branch).
    if: (github.event_name == 'workflow_dispatch' && inputs.ios) || contains(github.event.head_commit.message, '[ios]')
    runs-on: macos-15
    defaults: {run: {working-directory: darb/app}}
    steps:
      - uses: actions/checkout@v4
      # Xcode 26.3: the newest that runs on Sequoia (the Hackintosh) and meets Apple's Xcode 26 upload rule.
      - run: sudo xcode-select -s /Applications/Xcode_26.3.app && xcodebuild -version
      - uses: subosito/flutter-action@v2
        with: {flutter-version: "3.35.7", channel: stable, cache: true}
      - run: flutter pub get && flutter build ios --simulator --debug
      - name: Launch on a simulator and take a screenshot
        run: |
          xcrun simctl list runtimes
          DEV=$(xcrun simctl create darb "iPhone SE (3rd generation)" 2>/dev/null || xcrun simctl create darb "iPhone 16e")
          xcrun simctl boot "$DEV"
          xcrun simctl install "$DEV" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$DEV" sa.darbedu.app
          sleep 25
          xcrun simctl io "$DEV" screenshot ios-launch.png
          xcrun simctl spawn "$DEV" launchctl list | grep -q sa.darbedu.app && echo "app is running"
      - uses: actions/upload-artifact@v4
        with: {name: ios-simulator, path: darb/app/ios-launch.png}
